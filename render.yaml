services:
  - type: web
    name: hotspot-pulse
    runtime: node
    region: singapore
    plan: starter
    branch: main
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    disk:
      name: hotspot-pulse-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: REFRESH_INTERVAL_MINUTES
        value: 30
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_DAILY_URL
        value: https://ta1zai.com/daily.html
      - key: WECOM_BOT_WEBHOOK
        sync: false
      - key: X_SOURCE
        value: trends24
      - key: X_TRENDS24_REGION
        value: united-states
      - key: WEIBO_SOURCE
        value: official-first
      - key: WEIBO_FREE_API_URL
        value: https://api.52vmy.cn/api/wl/hot?type=weibo
      - key: WEIBO_COOKIE
        sync: false
      - key: TIKTOK_SOURCE
        value: creative-center
      - key: TIKTOK_CREATIVE_CENTER_COUNTRY
        value: US
      - key: TIKTOK_CREATIVE_CENTER_PERIOD
        value: 7
      - key: REDDIT_SUBREDDIT
        value: popular
      - key: REDDIT_SORT
        value: hot
      - key: REDDIT_LIMIT
        value: 30
      - key: REDDIT_SOURCE
        value: proxy-first
      - key: GAMERSKY_RSS_URL
        value: https://rsshub.rssforever.com/gamersky/news
      - key: THREEDM_RSS_URL
        value: https://rsshub.rssforever.com/3dmgame/news
      - key: YYSTV_RSS_URL
        value: https://www.yystv.cn/rss/feed
      - key: GCORES_RSS_URL
        value: https://rsshub.rssforever.com/gcores/news
      - key: BILIBILI_DAILY_RSS_URL
        value: https://rsshub.rssforever.com/bilibili/ranking/all/0/3
      - key: BILIBILI_WEEKLY_RSS_URL
        value: https://rsshub.rssforever.com/bilibili/weekly
      - key: GAMERES_JSON_URL
        value: https://www.gameres.com/newslistJson
      - key: NADIANSHI_RSS_URL
        value: http://www.nadianshi.com/feed
      - key: GAMELOOK_RSS_URL
        value: http://www.gamelook.com.cn/feed
      - key: DOUBAN_NOWPLAYING_CITIES
        value: all
