<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>身梦TV</title>
    <link rel="stylesheet" href="/styles.css" />
    <script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script defer src="/daily.js"></script>
  </head>
  <body>
    <main class="daily-page">
      <header class="daily-hero">
        <a class="link-button" href="/">
          <i data-lucide="arrow-left"></i>
          返回看板
        </a>
        <p class="eyebrow">身梦TV</p>
        <h1>今日热点日报</h1>
        <p id="dailySummary">加载中...</p>
        <div class="daily-stats">
          <span id="dailyDate">-</span>
          <span id="dailyCount">- 条热点</span>
          <span id="dailyManualCount">- 条手动添加</span>
        </div>
        <div class="daily-history-control">
          <label for="dailyHistorySelect">历史日报</label>
          <select id="dailyHistorySelect">
            <option value="">最新日报</option>
          </select>
        </div>
      </header>

      <section class="daily-section">
        <div class="section-head">
          <div>
            <p class="eyebrow">Top picks</p>
            <h2>今日重点</h2>
          </div>
        </div>
        <div class="daily-list" id="dailyTopList"></div>
      </section>
    </main>
  </body>
</html>
